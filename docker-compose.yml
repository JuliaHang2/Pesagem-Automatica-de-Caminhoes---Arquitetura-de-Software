services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pesagem
      POSTGRES_USER: pesagem
      POSTGRES_PASSWORD: pesagem
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesagem"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pesagem
      DB_USER: pesagem
      DB_PASSWORD: pesagem
      JWT_SECRET: troque-este-segredo-em-producao-32-bytes-minimo!
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  dados:
